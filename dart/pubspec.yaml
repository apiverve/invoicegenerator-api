name: apiverve_invoicegenerator
description: "Invoice Generator is an invoice generation API that creates downloadable PDF invoices from party addresses, line items, and payment terms. It computes subtotals with discounts and sales tax, returning an expiring download link."
version: 1.2.5
homepage: https://apiverve.com/marketplace/invoicegenerator?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/invoicegenerator-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
